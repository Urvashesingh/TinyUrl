apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortener-api
  namespace: shortener
  labels:
    app: shortener
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shortener
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: shortener
        component: api
    spec:
      # The app drains for up to 10 seconds; give it more than that so a slow
      # drain finishes rather than being SIGKILLed halfway through.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      # Spread across nodes, so losing one node cannot take out every replica.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: shortener
              component: api
      containers:
        - name: api
          image: url-shortener:local
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: shortener-config
            - secretRef:
                name: shortener-secrets
          # Requests are not a formality: the HPA computes utilisation as a
          # percentage of the request, so an unset request means no CPU-based
          # autoscaling at all.
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              # No CPU limit on purpose. A CPU limit throttles a Node event
              # loop in ways that look exactly like a slow dependency, and the
              # request already guarantees a floor.
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Liveness deliberately does not touch Postgres. If it did, a
          # database blip would fail every pod's liveness probe at once and
          # Kubernetes would restart the entire fleet -- turning a recoverable
          # outage into a crash loop.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # Readiness does check Postgres, so a pod that cannot serve is taken
          # out of the Service without being killed.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          # Slow starts are a startup problem, not a liveness problem. Without
          # this, a cold start longer than the liveness threshold becomes an
          # infinite restart loop.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20
          lifecycle:
            preStop:
              exec:
                # Endpoint removal and SIGTERM race. Without this pause the pod
                # can stop accepting connections before every proxy has learned
                # it is going away, which shows up as 502s during a deploy.
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: shortener-api
  namespace: shortener
spec:
  selector:
    app: shortener
    component: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shortener-api
  namespace: shortener
spec:
  # Node drains and cluster upgrades are voluntary disruptions; without this
  # they can legally evict every replica at once.
  minAvailable: 2
  selector:
    matchLabels:
      app: shortener
      component: api
