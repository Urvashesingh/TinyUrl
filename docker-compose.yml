# Local infrastructure. Phase 0 needs only Postgres.
# Redis (Phase 1), Kafka (Phase 4), etc. get added as we reach them.
services:
  postgres:
    image: postgres:17-alpine
    container_name: shortener-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
