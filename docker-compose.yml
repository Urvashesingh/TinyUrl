# Local infrastructure.
# Phase 0 needs Postgres. Phase 1 adds Redis. Kafka (Phase 4) comes later.
services:
  postgres:
    image: postgres:17-alpine
    container_name: shortener-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shortener-redis
    restart: unless-stopped
    # This Redis holds only derived data, so it is configured as a pure cache:
    #   --save ""             no RDB snapshots; losing it costs a few slow reads
    #   --maxmemory           a hard ceiling, so it cannot starve the host
    #   allkeys-lru           evict cold keys instead of erroring on OOM
    command:
      - redis-server
      - --save
      - ""
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Phase 4. KRaft mode, so no ZooKeeper.
  kafka:
    image: apache/kafka:3.9.0
    container_name: shortener-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBRkNBRjZFNEQyNw
      # Two listeners on purpose: EXTERNAL is what the host reaches on
      # localhost:9092, INTERNAL is what other containers reach on kafka:29092.
      # A single listener cannot advertise a hostname that is correct from both
      # sides, and getting this wrong is the classic "connects then hangs" bug.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Single broker, so nothing can be replicated anywhere. Fine locally and
      # emphatically not a production setting.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  kafka-data:
