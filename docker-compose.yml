# Local infrastructure.
# Phase 0 needs Postgres. Phase 1 adds Redis. Kafka (Phase 4) comes later.
services:
  postgres:
    image: postgres:17-alpine
    container_name: shortener-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    # wal_level=replica is already the default in modern Postgres; it is spelled
    # out here because the whole standby depends on it and a silent default is a
    # bad thing to depend on.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Phase 6. Streaming replica, built by cloning the primary on first start.
  postgres-replica:
    image: postgres:17-alpine
    container_name: shortener-postgres-replica
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5433:5432"
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        chown -R postgres:postgres /var/lib/postgresql
        # An empty data directory means this is a fresh standby: clone the
        # primary. -R writes standby.signal and primary_conninfo, which is what
        # makes this a streaming replica rather than a one-off copy.
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          until gosu postgres pg_isready -h postgres -U shortener -q; do
            echo "waiting for primary"; sleep 1;
          done
          rm -rf "$$PGDATA"/*
          gosu postgres pg_basebackup -h postgres -U shortener -D "$$PGDATA" -Fp -Xs -R
        fi
        chmod 0700 "$$PGDATA"
        exec gosu postgres postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: shortener-redis
    restart: unless-stopped
    # This Redis holds only derived data, so it is configured as a pure cache:
    #   --save ""             no RDB snapshots; losing it costs a few slow reads
    #   --maxmemory           a hard ceiling, so it cannot starve the host
    #   allkeys-lru           evict cold keys instead of erroring on OOM
    command:
      - redis-server
      - --save
      - ""
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Phase 4. KRaft mode, so no ZooKeeper.
  kafka:
    image: apache/kafka:3.9.0
    container_name: shortener-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBRkNBRjZFNEQyNw
      # Two listeners on purpose: EXTERNAL is what the host reaches on
      # localhost:9092, INTERNAL is what other containers reach on kafka:29092.
      # A single listener cannot advertise a hostname that is correct from both
      # sides, and getting this wrong is the classic "connects then hangs" bug.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Single broker, so nothing can be replicated anywhere. Fine locally and
      # emphatically not a production setting.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # --- application services ---------------------------------------------
  # Behind the "app" profile, so `docker compose up -d` still starts only the
  # infrastructure and the npm run dev workflow from earlier phases is
  # unchanged. `docker compose --profile app up -d` runs the whole system.

  # One-shot. Migrations must complete before anything serves traffic, and they
  # run from the build stage because the Prisma CLI is a devDependency that is
  # deliberately absent from the runtime image.
  migrate:
    build:
      context: .
      target: build
    image: url-shortener-migrate:local
    profiles: ["app"]
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://shortener:shortener@postgres:5432/shortener?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: url-shortener:local
    # No container_name and a port *range*: both of those pin a service to a
    # single instance, and `--scale api=3` fails on a name or port collision.
    profiles: ["app"]
    restart: unless-stopped
    environment: &app-env
      DATABASE_URL: postgresql://shortener:shortener@postgres:5432/shortener?schema=public
      DATABASE_REPLICA_URL: postgresql://shortener:shortener@postgres-replica:5432/shortener?schema=public
      REDIS_URL: redis://redis:6379
      # The INTERNAL listener, not localhost:9092 -- that one only resolves
      # correctly from the host.
      KAFKA_BROKERS: kafka:29092
      EVENT_TRANSPORT: kafka
      IP_HASH_SALT: compose-development-salt
      BASE_URL: http://localhost:3000
      LOG_LEVEL: info
    # A fixed port, so the console is always at localhost:3000. A range would
    # let Docker pick, and "which port is it on today" is a bad question to
    # answer in front of an audience. Scaling overrides this -- see
    # docker-compose.loadtest.yml.
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  consumer:
    build: .
    image: url-shortener:local
    profiles: ["app"]
    restart: unless-stopped
    command: ["node", "dist/consumer.js"]
    environment: *app-env
    # No port and no HTTP healthcheck: this process serves nothing. Its
    # liveness signal is that it stays connected to its consumer group.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # --- observability (Phase 12) -----------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: shortener-prometheus
    profiles: ["app"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.5.1
    container_name: shortener-grafana
    profiles: ["app"]
    restart: unless-stopped
    environment:
      # Local only. Anonymous admin exists so the dashboard opens without a
      # login prompt while developing; a real deployment does neither.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "3001:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  postgres-replica-data:
  kafka-data:
  prometheus-data:
  grafana-data:
