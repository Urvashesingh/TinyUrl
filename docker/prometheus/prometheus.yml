global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: shortener-api
    metrics_path: /metrics
    # DNS service discovery, so `--scale api=3` is picked up automatically.
    # A static host:port would scrape whichever replica Docker's DNS happened
    # to answer with and silently miss the rest.
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 3000

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
